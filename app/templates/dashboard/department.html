{% extends "base.html" %}
{% block title %}Department Dashboard{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-2">Welcome, {{ current_user.username }}</h2>
    <p class="lead mb-4">Department access – take parts from inventory</p>

    <div class="row g-4 justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card text-center h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h1 class="display-1 mb-3">📦</h1>
                    <h4>Take Part</h4>
                    <p class="text-muted">Scan or search a part and remove it from stock</p>
                    <a href="{{ url_for('parts.take_part') }}" class="btn btn-danger btn-lg w-100 mt-auto">
                        Take Part
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
