{% extends "base.html" %}
{% block title %}In Progress / On Hold{% endblock %}
{% block content %}
<div class="container mt-3">
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary mb-3">← Back</a>
  <h2 class="text-center mb-3">In Progress / On Hold</h2>
  <div class="card shadow-sm">
    <div class="list-group list-group-flush">
      {% for item in items %}
      <a href="{{ item.url }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        <span>
          <span class="badge bg-primary me-2">{{ item.kind }}</span>
          {{ item.title }}
        </span>
        <small class="text-muted">{{ item.who }}</small>
      </a>
      {% else %}
      <div class="list-group-item text-muted">Nothing in progress or on hold</div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
