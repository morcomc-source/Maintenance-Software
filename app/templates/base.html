<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.5, user-scalable=yes">
    <title>{% block title %}Maintenance Inventory{% endblock %}</title>

    <!-- Bootstrap 5 for clean mobile layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PWA manifest and theme -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1976d2">

    <!-- Your existing custom styles (copied from pm.html) -->
    <style>
        .tabs { margin-bottom: 20px; }
        .tab-button {
            padding: 10px 20px;
            cursor: pointer;
            background: #ddd;
            border: none;
            font-size: 16px;
        }
        .tab-button.active { background: #007bff; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; cursor: pointer; }
        th.sort-asc::after { content: " ↑"; }
        th.sort-desc::after { content: " ↓"; }
        #delete-confirm { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 1px solid #ccc; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        #view-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 1px solid #ccc; z-index: 1000; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        #sub-equipment-group, #sub-equipment-group-search { display: none; }
        #frequency-group, #frequency-group-search { display: none; }
        form { display: block; }
    </style>
</head>
<body>
    <!-- Top navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Maintenance Inventory</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="/parts">Parts</a>
                    <a class="nav-link" href="/pm">PM</a>
                    <!-- Add more links here later (work orders, machines, etc.) -->
                </div>
            </div>
        </div>
		<li class="nav-item">
			<a class="nav-link" href="{{ url_for('auth.logout') }}">
				<i class="bi bi-box-arrow-right"></i> Logout
			</a>
		</li>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- PWA service worker registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/serviceworker.js');
            });
        }
    </script>
	</body>
</html>
