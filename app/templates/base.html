<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.5, user-scalable=yes">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Maintenance">
    <title>{% block title %}Maintenance{% endblock %}</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .tabs { margin-bottom: 20px; }
        .tab-button {
            padding: 10px 20px;
            cursor: pointer;
            background: #ddd;
            border: none;
            font-size: 16px;
        }
        .tab-button.active { background: #007bff; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; cursor: pointer; }
    </style>
	<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container-fluid position-relative" style="min-height: 56px;">
        {% if current_user.is_authenticated %}
        <a class="navbar-brand position-absolute top-50 start-50 translate-middle mb-0" href="{{ url_for('dashboard.index') }}">Maintenance</a>
        <div class="ms-auto d-flex align-items-center">
            <span class="text-light small me-3 d-none d-sm-inline">{{ current_user.username }}</span>
            <a class="btn btn-sm btn-outline-light" href="{{ url_for('auth.logout') }}">Logout</a>
        </div>
        {% else %}
        <a class="navbar-brand position-absolute top-50 start-50 translate-middle mb-0" href="{{ url_for('auth.login') }}">Maintenance</a>
        {% endif %}
    </div>
</nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/serviceworker.js', { scope: '/' })
                    .catch(function (err) {
                        console.log('Service worker registration failed:', err);
                    });
            });
        }
    </script>
</body>
</html>
