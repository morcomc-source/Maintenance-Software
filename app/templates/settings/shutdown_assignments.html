{% extends "base.html" %}
{% block title %}Shutdown Assignments{% endblock %}
{% block content %}
<div class="container mt-4">
    <a href="{{ url_for('settings.index') }}" class="btn btn-secondary w-100 mb-4">← Back to System Setup</a>
    <h2 class="text-center mb-4">Shutdown Project Assignments</h2>
    <p class="text-muted text-center">One option per line. These appear in the Assigned To dropdown on shutdown projects.</p>
    <form method="post" class="col-lg-6 mx-auto">
        <div class="mb-3">
            <label class="form-label">Assignment options</label>
            <textarea name="list" class="form-control" rows="10">{{ current }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save List</button>
    </form>
</div>
{% endblock %}
