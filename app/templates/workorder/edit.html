{% extends "base.html" %}
{% block title %}Edit Work Order #{{ wo.id }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Work Order #{{ wo.id }}</h2>
    <a href="{{ url_for('workorder.index') }}" class="btn btn-secondary mb-3">← Back to List</a>

    <div class="card">
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label">Equipment</label>
                        <input type="text" name="equipment" class="form-control" value="{{ wo.equipment }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Priority (1-5)</label>
                        <select name="priority" class="form-select">
                            <option value="1" {% if wo.priority == 1 %}selected{% endif %}>1 - Low</option>
                            <option value="2" {% if wo.priority == 2 %}selected{% endif %}>2</option>
                            <option value="3" {% if wo.priority == 3 or not wo.priority %}selected{% endif %}>3 - Medium</option>
                            <option value="4" {% if wo.priority == 4 %}selected{% endif %}>4</option>
                            <option value="5" {% if wo.priority == 5 %}selected{% endif %}>5 - Critical</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="5" required>{{ wo.description }}</textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="Open" {% if wo.status == 'Open' %}selected{% endif %}>Open</option>
                            <option value="Assigned" {% if wo.status == 'Assigned' %}selected{% endif %}>Assigned</option>
                            <option value="In Progress" {% if wo.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                            <option value="Completed" {% if wo.status == 'Completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Expected Completion Date</label>
                        <input type="date" name="expected_completion_date" class="form-control" 
                               value="{{ wo.expected_completion_date.strftime('%Y-%m-%d') if wo.expected_completion_date else '' }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Assign To</label>
                        <select name="assigned_to_id" class="form-select">
                            <option value="">— Unassigned —</option>
                            {% for tech in technicians %}
                            <option value="{{ tech.id }}" {% if wo.assigned_to_id == tech.id %}selected{% endif %}>
                                {{ tech.username }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-success btn-lg w-100">Save Changes</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
