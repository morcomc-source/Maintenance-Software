{% extends "base.html" %}
{% block title %}Edit Work Order{% endblock %}
{% block content %}
<div class="container mt-4" style="max-width: 820px;">
    <a href="{{ url_for('workorder.index') }}" class="btn btn-secondary mb-3">← Back to Work Orders</a>
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="mb-3">Edit Work Order #{{ wo.id }}</h3>
            <form method="POST" action="{{ url_for('workorder.update', wo_id=wo.id) }}">
                <div class="mb-3">
                    <label class="form-label">Location / area</label>
                    <input type="text" name="location" id="location-search" class="form-control"
                           value="{{ wo.location or '' }}" placeholder="Start typing a location..." autocomplete="off">
                    <div id="location-suggest" class="list-group mt-1"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Equipment</label>
                    <input type="text" name="equipment" id="equipment-search" class="form-control"
                           value="{{ wo.equipment or '' }}" required autocomplete="off">
                    <input type="hidden" name="equipment_id" id="equipment-id" value="{{ wo.equipment_id or '' }}">
                    <div id="equipment-suggest" class="list-group mt-1"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="4" required>{{ wo.description or '' }}</textarea>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Type</label>
                        <select name="work_area" class="form-select">
                            <option value="">—</option>
                            <option value="facility" {% if wo.work_area == 'facility' %}selected{% endif %}>Facility</option>
                            <option value="press" {% if wo.work_area == 'press' %}selected{% endif %}>Press</option>
                            <option value="mobile" {% if wo.work_area == 'mobile' %}selected{% endif %}>Mobile</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Machine down?</label>
                        <select name="machine_down" class="form-select">
                            <option value="0" {% if not wo.machine_down %}selected{% endif %}>No</option>
                            <option value="1" {% if wo.machine_down %}selected{% endif %}>Yes</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Priority</label>
                        <select name="priority" class="form-select">
                            <option value="1" {% if wo.priority == 1 %}selected{% endif %}>Can wait</option>
                            <option value="2" {% if wo.priority == 2 or not wo.priority %}selected{% endif %}>Normal</option>
                            <option value="3" {% if wo.priority == 3 %}selected{% endif %}>Soon</option>
                            <option value="4" {% if wo.priority == 4 %}selected{% endif %}>Critical</option>
                        </select>
                    </div>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="safety_issue" id="safety_issue" {% if wo.safety_issue %}checked{% endif %}>
                    <label class="form-check-label" for="safety_issue">This is a safety issue</label>
                </div>
                <div class="mb-3">
                    <label class="form-label">Name or phone</label>
                    <input type="text" name="contact" class="form-control" value="{{ wo.contact or '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for s in ['Open','Assigned','In Progress','Completed'] %}
                        <option value="{{ s }}" {% if wo.status == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Needed by</label>
                        <input type="date" name="expected_completion_date" class="form-control"
                               value="{{ wo.expected_completion_date.strftime('%Y-%m-%d') if wo.expected_completion_date else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Assign to</label>
                        <select name="assigned_to_id" class="form-select">
                            <option value="">— Leave unassigned —</option>
                            {% for tech in technicians %}
                            <option value="{{ tech.id }}" {% if wo.assigned_to_id == tech.id %}selected{% endif %}>{{ tech.display_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Save changes</button>
            </form>
        </div>
    </div>
</div>
<script>
(function(){
  const loc = document.getElementById('location-search');
  const locBox = document.getElementById('location-suggest');
  const eq = document.getElementById('equipment-search');
  const eqBox = document.getElementById('equipment-suggest');
  const eqId = document.getElementById('equipment-id');
  function pick(box, input, extra){
    box.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        input.value = b.dataset.name;
        if (extra) extra(b);
        box.innerHTML = '';
      });
    });
  }
  if (loc) loc.addEventListener('input', async function(){
    const q = loc.value.trim();
    if (q.length < 1) { locBox.innerHTML=''; return; }
    const r = await fetch('/workorder/locations?q=' + encodeURIComponent(q));
    const rows = await r.json();
    locBox.innerHTML = rows.map(x => '<button type="button" class="list-group-item list-group-item-action" data-name="'+x+'">'+x+'</button>').join('');
    pick(locBox, loc);
  });
  if (eq) eq.addEventListener('input', async function(){
    const location = (loc && loc.value) ? loc.value.trim() : '';
    const q = eq.value.trim();
    let url = '/workorder/machines?q=' + encodeURIComponent(q);
    if (location) url += '&location=' + encodeURIComponent(location);
    const r = await fetch(url);
    const rows = await r.json();
    eqBox.innerHTML = rows.map(x => '<button type="button" class="list-group-item list-group-item-action" data-name="'+(x.name||x)+'" data-id="'+(x.equipment_id||'')+'">'+(x.name||x)+'</button>').join('');
    pick(eqBox, eq, function(b){ if (eqId) eqId.value = b.dataset.id || ''; });
  });
})();
</script>
{% endblock %}
