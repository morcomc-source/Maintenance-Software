{% extends "base.html" %}
{% block title %}Work Orders{% endblock %}
{% block content %}
<h2>Work Orders</h2>
<table class="table">
    <thead>
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        {% for wo in workorders %}
        <tr>
            <td>{{ wo.title }}</td>
            <td>{{ wo.description or 'N/A' }}</td>
            <td>{{ wo.status }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
